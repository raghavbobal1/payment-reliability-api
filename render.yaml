# Public demo uses temporary in-memory data so it stays usable
# after the free Render PostgreSQL database expires.
# PostgreSQL remains available locally and in GitHub Actions.
services:
  - type: web
    name: payment-reliability-demo
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
